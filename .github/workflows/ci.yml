name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Identity check (only vincentwesley commits)
        run: |
          bad=$(git log --format='%an|%ae|%cn|%ce' | tr '|' '\n' | sort -u | grep -vE '^(vincentwesley|Vincent Wesley|GitHub|github-actions\[bot\]|dependabot\[bot\]|221810966\+vincentwesley@users\.noreply\.github\.com|noreply@github\.com|[0-9]+\+(github-actions|dependabot)\[bot\]@users\.noreply\.github\.com)$' || true)
          if [ -n "$bad" ]; then echo "Unexpected commit identities:"; echo "$bad"; exit 1; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tldr-panel
          path: release/*.zip
      - run: npx playwright install --with-deps chromium
      - run: node scripts/build.mjs --e2e
      - run: xvfb-run --auto-servernum npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-results
          path: test-results
